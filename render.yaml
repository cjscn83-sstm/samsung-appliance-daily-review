# Render 블루프린트 — FastAPI 뷰어를 공개 웹서비스로 배포.
# Render 대시보드에서 이 저장소 연결 후 Blueprint로 생성하면 자동 인식된다.
# DATABASE_URL 은 여기 두지 말고 대시보드 Environment 에 시크릿으로 입력할 것.
services:
  - type: web
    name: samsung-appliance-review-viewer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn viewer.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
